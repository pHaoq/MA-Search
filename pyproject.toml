[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-finder"
version = "0.1.0"
description = "Multi-agent loop that mines sources for master thesis topics with Claude, Gemini and GPT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3",
    "openai>=3.37",
    "google-genai>=2.33",
    "pydantic>=2.6",
    "pyyaml>=6",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
thesis-finder = "thesis_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
