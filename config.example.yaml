# Copy to config.yaml and edit. config.yaml is git-ignored.

profile:
  field: Information Systems
  degree: Master
  country: Austria
  university: ""            # e.g. WU Wien, TU Wien, JKU Linz
  interests: []             # e.g. [generative AI, process mining, digital platforms]
  methods: []               # e.g. [survey, interviews, design science, data analysis]
  languages: [English, German]
  timeframe_months: 6
  # The more specific these are, the more original the topics. All optional.
  seed_papers: []           # 3-5 papers you liked, e.g. ["Smith et al. (2024) Generative AI in SME accounting, MISQ"]
  data_access: ""           # data or field access only you have: employer, internship, club, family business
  target_chair: ""          # chair or supervisor you aim for and their research focus
  notes: ""                 # anything else: industry partner, things to avoid

# Which providers deep-search and judge. Claude is always used as coordinator
# (planning briefs, extracting topics, duplicate checks).
providers: [claude, gemini, openai]

models:
  claude_research: claude-sonnet-5-5   # claude-opus-5-5 is about 2x the price
  claude_planner: claude-opus-5-5      # only used with loop.planner: claude
  claude_judge: claude-sonnet-5-5
  claude_fast: claude-haiku-5-5
  claude_ranker: claude-fable-5-1      # only with review.provider: claude
  claude_reviewer: claude-sonnet-5-5   # only with review.provider: claude
  gemini_agent: deep-research-preview-04-2026   # or deep-research-max-preview-04-2026
  gemini_judge: gemini-4-argon
  openai_research: gpt-6.1-sol
  openai_judge: gpt-6.1-sol
  openai_ranker: gpt-6.1-sol           # ranks valid topics in the review

# Limits for one Claude deep search. Every search result and fetched page is added to
# the context and re-read on each step, so these drive most of Claude's cost.
claude_search:
  max_searches: 8
  max_fetches: 4
  max_fetch_tokens: 15000   # cap on one fetched page
  effort: medium            # low | medium | high

embedding:
  provider: openai          # openai | gemini | local (free, weaker)
  model: text-embedding-3-small   # gemini: gemini-embedding-001

loop:
  budget_usd: 5             # cap per run; a round is skipped if it would likely overshoot
  target_valid: 40          # stop once this many valid topics are stored
  saturation_rounds: 3      # stop after this many rounds in a row with...
  saturation_new_ratio: 0.10  # ...fewer than 10% new topics
  max_rounds: 60
  topics_per_report: 5      # topics each deep search is asked for
  planner: template         # template (free) | claude (Claude writes each brief)

dedup:
  duplicate_threshold: 0.88
  borderline_threshold: 0.78

# Keeps the agents away from topics that are already done.
originality:
  prior_art_check: true     # OpenAlex + Semantic Scholar before judging; free, no LLM call
  prior_art_cutoff: 0.82    # similarity to an existing paper at which a topic counts as already done
  fresh_months: 18          # calls, agendas, projects and job ads must be at most this old
  paper_from_year: 2024     # starting papers from this year on ("replicate" still uses well-cited older ones)

# Paying less for the same models.
cost:
  flex_search: true         # OpenAI + Gemini deep searches at half the token price; may queue a few minutes
  flex_judge: false         # true halves judge cost too, but each topic can then wait minutes

validation:
  min_pass_votes: 2         # of the judges (one per provider)
  min_mean_score: 3.5
  min_novelty: 3            # every judge must score novelty at least this

# Promotes the best valid topics to "checked". A topic that fails goes back to invalid.
review:
  provider: openai          # openai (cheaper) | claude (Fable 5.1 ranks, Sonnet 5.5 reviews; several times the cost)
  every_rounds: 7           # one full rotation of models x strategies
  at_end_of_run: true
  top_k: 5                  # topics the ranker picks for a literature review
  park_after: 3             # valid topics not picked in this many reviews are parked
  max_candidates: 60

store_path: data/topics.db
cost_log_path: data/costs.csv   # every API call with tokens and USD; see `thesis-finder costs`

# prices:                   # override USD per 1M tokens [input, output]
#   gemini-4-argon: [4.0, 20.0]
